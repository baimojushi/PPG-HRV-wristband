[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; v0.3.0 起 PPG 算法完整纳入项目：
; firmware/lib/zeezPPG/
;
; 不再依赖 Arduino IDE 全局库、PlatformIO lib_deps、
; 也不再在 .pio/libdeps 中打补丁。
lib_ldf_mode = deep+

build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
